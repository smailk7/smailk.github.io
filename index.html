<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PustakaBaca - Baca Buku & Novel Online Gratis</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">📖 PustakaBaca</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Beranda</a></li>
        <li><a href="#koleksi">Koleksi Buku</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Perpustakaan Digital Gratis</h1>
      <p>Baca ribuan buku, novel, dan artikel favoritmu secara langsung tanpa biaya.</p>
      <div class="search-box">
        <input type="text" id="searchInput" onkeyup="searchBook()" placeholder="Cari judul buku atau penulis...">
      </div>
    </section>

    <h2 class="section-title" id="koleksi">📚 Koleksi Buku & Novel</h2>
    <div class="book-grid" id="book-list"></div>
  </main>

  <!-- Modal Reader untuk Membaca Isi Buku -->
  <div class="modal" id="readerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Judul Buku</h3>
        <button class="close-btn" onclick="closeReader()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent"></div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 PustakaBaca. Platform Baca Buku Gratis.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
