<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ceritaku- cerita Digital</title>
  <!-- Menghubungkan ke file style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">📖 ceritaku</a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Beranda</a></li>
        <li><a href="#koleksi">Koleksi Buku</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>cerita Digital </h1>
      <p>Baca buku, novel, dan artikel secara langsung </p>
      <div class="search-box">
        <input type="text" id="searchInput" onkeyup="searchBook()" placeholder="Cari judul buku atau penulis...">
      </div>
    </section>

    <h2 class="section-title" id="koleksi">📚 Koleksi Buku & Novel</h2>
    <div class="book-grid" id="book-list"></div>
  </main>

  <!-- Modal Reader (Pembaca Multi-Halaman) -->
  <div class="modal" id="readerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Judul Buku</h3>
        <button class="close-btn" onclick="closeReader()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent"></div>
      <div class="modal-footer">
        <button class="btn" id="prevBtn" onclick="changePage(-1)">⬅️ Sebelumnya</button>
        <span class="page-indicator" id="pageNumber">Halaman 1 dari 1</span>
        <button class="btn" id="nextBtn" onclick="changePage(1)">Selanjutnya ➡️</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 PustakaBaca. Platform Baca Buku Gratis.</p>
  </footer>

  <!-- Menghubungkan ke file script.js -->
  <script src="script.js"></script>
</body>
</html>
